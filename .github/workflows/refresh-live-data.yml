name: Refresh Live Data

on:
  workflow_dispatch:
  schedule:
    - cron: "5,35 * * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
  TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
  EWS_INTERNAL_ALERT_TOKEN: ${{ secrets.EWS_INTERNAL_ALERT_TOKEN }}
  EWS_INTERNAL_ALERT_URL: ${{ vars.EWS_INTERNAL_ALERT_URL || 'https://ewsalert.netlify.app/api/internal/level5-alert' }}
  EWS_INTERNAL_CLEANUP_URL: ${{ vars.EWS_INTERNAL_CLEANUP_URL || 'https://ewsalert.netlify.app/api/internal/anonymize-pending-signups' }}
  STATE_STORE: ews-state
  PUBLIC_STORE: ews-public
  MAIN_DB_PATH: data/ews-main.sqlite
  MILITARY_DB_PATH: data/ews-military.sqlite
  UNTRACKED_DB_PATH: data/ews-untracked.sqlite
  EWS_PUBLIC_URL: https://ewsalert.netlify.app/
  EWS_RSS_URL: https://ewsalert.netlify.app/rss.xml
  VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL }}
  VITE_MILITARY_DASHBOARD_URL: ${{ vars.VITE_MILITARY_DASHBOARD_URL }}
  VITE_UNTRACKED_DASHBOARD_URL: ${{ vars.VITE_UNTRACKED_DASHBOARD_URL }}

concurrency:
  group: refresh-live-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm ci
          pip install -r requirements.txt

      - name: Restore main deployment state
        run: |
          mkdir -p data
          if node scripts/netlify-blobs.js get "${STATE_STORE}" ews-main.sqlite --file "${MAIN_DB_PATH}"; then
            echo "Restored main state from Netlify Blobs."
          else
            echo "No existing main state found; seeding new deployment DB."
            python3 scripts/import_faa_cohort.py --db "${MAIN_DB_PATH}"
            python3 scripts/import_global_cohort.py --db "${MAIN_DB_PATH}"
          fi

      - name: Restore military deployment state
        run: |
          mkdir -p data
          if node scripts/netlify-blobs.js get "${STATE_STORE}" ews-military.sqlite --file "${MILITARY_DB_PATH}"; then
            echo "Restored military state from Netlify Blobs."
          else
            echo "No existing military state; seeding new deployment DB."
            python3 scripts/import_global_cohort.py --db "${MILITARY_DB_PATH}" --tracked-category military --tracked-source global_military_aircraft
          fi

      - name: Restore untracked deployment state
        run: |
          mkdir -p data
          if node scripts/netlify-blobs.js get "${STATE_STORE}" ews-untracked.sqlite --file "${UNTRACKED_DB_PATH}"; then
            echo "Restored untracked state from Netlify Blobs."
          else
            echo "No existing untracked state; seeding new deployment DB."
            python3 scripts/track_non_icao_hex.py --db "${UNTRACKED_DB_PATH}" --latest-live --cache-dir data/cache/adsbx_live --replace-live-snapshot
          fi

      - name: Refresh latest main heatmap
        run: python3 scripts/update_latest_heatmap.py --db "${MAIN_DB_PATH}"

      - name: Refresh latest military heatmap
        run: python3 scripts/update_latest_heatmap.py --db "${MILITARY_DB_PATH}"

      - name: Refresh latest untracked heatmap
        run: python3 scripts/track_non_icao_hex.py --db "${UNTRACKED_DB_PATH}" --latest-live --cache-dir data/cache/adsbx_live --replace-live-snapshot

      - name: Export published dashboard snapshot
        run: node scripts/export_dashboard_snapshot.js --db "${MAIN_DB_PATH}" --output tmp/dashboard.json --endpoint main --cohort global_business_jet

      - name: Export published military dashboard snapshot
        run: node scripts/export_dashboard_snapshot.js --db "${MILITARY_DB_PATH}" --output tmp/military-dashboard.json --endpoint military --cohort global_military_aircraft

      - name: Export published untracked dashboard snapshot
        run: node scripts/export_dashboard_snapshot.js --db "${UNTRACKED_DB_PATH}" --output tmp/untracked-dashboard.json --endpoint untracked --cohort non_icao_untracked

      - name: Compress published dashboard snapshots
        run: |
          gzip -cn tmp/dashboard.json > tmp/dashboard.json.gz
          gzip -cn tmp/military-dashboard.json > tmp/military-dashboard.json.gz
          gzip -cn tmp/untracked-dashboard.json > tmp/untracked-dashboard.json.gz

      - name: Send Telegram emergency alert
        run: EWS_DB_PATH="${MAIN_DB_PATH}" node scripts/send_telegram_alert.js

      - name: Update RSS feed
        id: rss
        run: |
          RSS_RESULT="$(EWS_DB_PATH="${MAIN_DB_PATH}" node scripts/update_rss_feed.js --output tmp/rss.xml)"
          echo "$RSS_RESULT"
          RSS_UPDATED="$(node -e 'const data = JSON.parse(process.argv[1]); process.stdout.write(data.updated ? "true" : "false")' "$RSS_RESULT")"
          echo "updated=${RSS_UPDATED}" >> "$GITHUB_OUTPUT"

      - name: Send SMS and email emergency alert
        run: |
          if [ -z "${EWS_INTERNAL_ALERT_TOKEN}" ]; then
            echo "Skipping SMS/email alert trigger because EWS_INTERNAL_ALERT_TOKEN is not configured."
            exit 0
          fi

          curl -fsS -X POST "${EWS_INTERNAL_ALERT_URL}" \
            -H "Authorization: Bearer ${EWS_INTERNAL_ALERT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @tmp/dashboard.json

      - name: Anonymize unfinished notification signups
        run: |
          if [ -z "${EWS_INTERNAL_ALERT_TOKEN}" ]; then
            echo "Skipping pending signup anonymization because EWS_INTERNAL_ALERT_TOKEN is not configured."
            exit 0
          fi

          curl -fsS -X POST "${EWS_INTERNAL_CLEANUP_URL}" \
            -H "Authorization: Bearer ${EWS_INTERNAL_ALERT_TOKEN}"

      - name: Upload main deployment state
        run: node scripts/netlify-blobs.js put "${STATE_STORE}" ews-main.sqlite --file "${MAIN_DB_PATH}"

      - name: Upload military deployment state
        run: node scripts/netlify-blobs.js put "${STATE_STORE}" ews-military.sqlite --file "${MILITARY_DB_PATH}"

      - name: Upload untracked deployment state
        run: node scripts/netlify-blobs.js put "${STATE_STORE}" ews-untracked.sqlite --file "${UNTRACKED_DB_PATH}"

      - name: Publish RSS feed
        if: steps.rss.outputs.updated == 'true'
        run: node scripts/netlify-blobs.js put "${PUBLIC_STORE}" rss.xml --file tmp/rss.xml --content-type application/rss+xml

      - name: Publish live snapshot
        run: node scripts/netlify-blobs.js put "${PUBLIC_STORE}" dashboard.json --file tmp/dashboard.json.gz --content-type application/json --metadata '{"contentEncoding":"gzip"}'

      - name: Publish military live snapshot
        run: node scripts/netlify-blobs.js put "${PUBLIC_STORE}" military-dashboard.json --file tmp/military-dashboard.json.gz --content-type application/json --metadata '{"contentEncoding":"gzip"}'

      - name: Publish untracked live snapshot
        run: node scripts/netlify-blobs.js put "${PUBLIC_STORE}" untracked-dashboard.json --file tmp/untracked-dashboard.json.gz --content-type application/json --metadata '{"contentEncoding":"gzip"}'
